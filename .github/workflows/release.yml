name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package and upload
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BINARY="rust-faf-mcp"
          ARCHIVE="${BINARY}-${VERSION}-${{ matrix.target }}.tar.gz"
          cd target/${{ matrix.target }}/release
          tar czf "../../../${ARCHIVE}" "${BINARY}"
          cd ../../..
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-and-homebrew:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute SHA256s and update Homebrew
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/Wolfe-Jam/rust-faf-mcp/releases/download/v${VERSION}"

          curl -sL "${BASE}/rust-faf-mcp-${VERSION}-aarch64-apple-darwin.tar.gz" -o arm64-mac.tar.gz
          curl -sL "${BASE}/rust-faf-mcp-${VERSION}-x86_64-apple-darwin.tar.gz" -o x86-mac.tar.gz
          curl -sL "${BASE}/rust-faf-mcp-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o x86-linux.tar.gz

          SHA_ARM64=$(shasum -a 256 arm64-mac.tar.gz | cut -d" " -f1)
          SHA_X86_MAC=$(shasum -a 256 x86-mac.tar.gz | cut -d" " -f1)
          SHA_X86_LINUX=$(shasum -a 256 x86-linux.tar.gz | cut -d" " -f1)

          gh workflow run update-formula.yml \
            -R Wolfe-Jam/homebrew-faf \
            -f formula=rust-faf-mcp \
            -f version=$VERSION \
            -f sha256_arm64_macos=$SHA_ARM64 \
            -f sha256_x86_macos=$SHA_X86_MAC \
            -f sha256_x86_linux=$SHA_X86_LINUX
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
