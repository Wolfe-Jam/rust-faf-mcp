# Publish npm package (downloader shim) via OIDC Trusted Publishing.
# Does NOT replace publish-crate.yml (crates OIDC) or release.yml (binaries).
#
# Trusted Publisher UI must point at this exact filename: publish-npm.yml
# Configure after the package first exists (or with 2FA for first OIDC publish).
#
# Identity: one.faf/rust-faf-mcp (mcpName in package.json) — not io.github.

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify package.json version matches release tag
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          NPM_VERSION=$(node -p "require('./package.json').version")
          if [ "v${NPM_VERSION}" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $NPM_VERSION" >&2
            exit 1
          fi

      - name: Verify mcpName identity (one.faf — never io.github)
        run: |
          NAME=$(node -p "require('./package.json').mcpName")
          test "$NAME" = "one.faf/rust-faf-mcp" || {
            echo "::error::mcpName must be one.faf/rust-faf-mcp (got: $NAME)"
            exit 1
          }

      - name: Lockstep dry-run
        run: |
          ./scripts/mcp-dist-post.sh \
            --crate rust-faf-mcp \
            --mcp-name one.faf/rust-faf-mcp \
            --dry-run

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: npm publish (OIDC Trusted Publishing)
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public --provenance
