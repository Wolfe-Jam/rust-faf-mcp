name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo build --release

  # MSRV — builds on the rust-version Cargo.toml declares, read from Cargo.toml
  # so the claim and the gate can't drift. rust-toolchain.toml pins stable, so
  # the build names the toolchain explicitly.
  msrv:
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
      - run: cargo +${{ steps.msrv.outputs.v }} build --locked

  # Docker — the Dockerfile in the repo must build and the binary must answer
  # an MCP initialize.
  docker:
    name: Docker image builds and answers initialize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rust-faf-mcp:ci .
      - name: initialize over stdio
        run: |
          set -euo pipefail
          OUT=$( (printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'; sleep 2) | docker run -i --rm rust-faf-mcp:ci )
          echo "$OUT" | grep -q '"serverInfo"' || { echo "::error::no initialize response: $OUT"; exit 1; }
          echo "✓ $(echo "$OUT" | grep -o '"serverInfo":{[^}]*}')"

  # npm shim — the Node launcher users get from `npx rust-faf-mcp`. engines.node
  # is the floor of this matrix (scripts/check-engines.mjs keeps them equal).
  npm-shim:
    name: npm shim on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Engine floor gate
        run: node scripts/check-engines.mjs
      - name: Shim loads, resolves the target and spawns the binary
        run: |
          set -euo pipefail
          node -e "const {resolveTarget}=require('./lib/platform'); require('./lib/download'); console.log('target:', resolveTarget())"
          OUT=$(RUST_FAF_MCP_BIN=/bin/echo node npm/rust-faf-mcp.js shim-ok)
          [ "$OUT" = "shim-ok" ] || { echo "::error::shim did not pass args through (got '$OUT')"; exit 1; }
          echo "✓ shim spawns the binary on Node $(node -v)"
