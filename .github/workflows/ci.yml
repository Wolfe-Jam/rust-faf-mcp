name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo build --release

  # npm shim — the Node launcher users get from `npx rust-faf-mcp`. engines.node
  # is the floor of this matrix (scripts/check-engines.mjs keeps them equal).
  npm-shim:
    name: npm shim on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Engine floor gate
        run: node scripts/check-engines.mjs
      - name: Shim loads, resolves the target and spawns the binary
        run: |
          set -euo pipefail
          node -e "const {resolveTarget}=require('./lib/platform'); require('./lib/download'); console.log('target:', resolveTarget())"
          OUT=$(RUST_FAF_MCP_BIN=/bin/echo node npm/rust-faf-mcp.js shim-ok)
          [ "$OUT" = "shim-ok" ] || { echo "::error::shim did not pass args through (got '$OUT')"; exit 1; }
          echo "✓ shim spawns the binary on Node $(node -v)"
