[package]
name = "rust-faf-mcp"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
authors = ["wolfejam <wolfejam@faf.one>"]
description = "Persistent Project Context for Rust MCP clients. IANA-registered .faf format, Rust-native MCP server, single binary."
license = "MIT"
repository = "https://github.com/Wolfe-Jam/rust-faf-mcp"
homepage = "https://faf.one"
documentation = "https://docs.rs/rust-faf-mcp"
readme = "README.md"
keywords = ["faf", "mcp", "ai-context", "rust", "rmcp"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
faf-rust-sdk = "1.3"
rmcp = { version = "3.0.1", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt", "io-util", "io-std", "macros"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3.10"
serde_json = "1.0"
serde_yaml_ng = "0.10"

[[bin]]
name = "rust-faf-mcp"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
